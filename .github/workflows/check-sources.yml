name: Check for Ebola reports
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_updates.py
      - name: Commit queue
        run: |
          git config user.name "ebola-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/pending.json data/status.json
          git diff --cached --quiet || (git commit -m "Check sources" && git push)
